name: Runtime checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check core JavaScript syntax
        run: |
          node --check src/game.js
          node --check src/combat-runtime.js
          node --check src/meta-menu.js
          node --check src/menu-layout.js
          node --check src/menu-v2.js
          node --check src/menu-v2-topbar.js
          node --check src/menu-v2-world-header.js
          node --check src/menu-v3/menu-v3-shell.js
          node --check src/menu-v3/menu-v3-components.js
          node --check src/menu-v3/menu-v3-data.js
          node --check src/menu-v3/menu-v3-interactions.js
          node --check src/menu-v3/menu-v3-sync.js
          node --check src/menu-v3/menu-v3-geometry.js
          node --check src/app-shell.js
          node --check src/chests.js
          node --check src/inventory.js
          node --check playwright.config.mjs
          node --check tests/visual/menu-v3.visual.spec.mjs
          node --check scripts/validate-menu-v3-assets.mjs

      - name: Run combat runtime smoke test
        run: node tests/game-runtime-smoke.mjs

      - name: Validate Menu V3 structural contract
        run: node tests/menu-v3-contract.mjs

      - name: Validate Menu V3 components
        run: node tests/menu-v3-components-contract.mjs

      - name: Validate Menu V3 synchronized data
        run: node tests/menu-v3-data-contract.mjs

      - name: Validate Menu V3 synchronized interactions
        run: node tests/menu-v3-interactions-contract.mjs

      - name: Validate Menu V3 synchronization coordinator
        run: node tests/menu-v3-sync-contract.mjs

      - name: Validate Menu V3 Lot 4 geometry lock
        run: node tests/menu-v3-geometry-contract.mjs

      - name: Validate Menu V3 Lot 4.5 automation contract
        run: node tests/menu-v3-visual-contract.mjs

      - name: Validate Menu V3 Lot 5.0 asset pipeline contract
        run: node tests/menu-v3-assets-contract.mjs

      - name: Validate Rightbound 2D cartoon art direction
        run: node tests/menu-v3-style-contract.mjs

      - name: Validate iPhone and Android portrait target
        run: node tests/mobile-platform-contract.mjs

  visual:
    name: Menu V3 multi-viewport visual checks
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Menu V3 multi-viewport visual tests
        run: npm run test:visual

      - name: Upload Menu V3 visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-v3-lot-4-5-visual-${{ github.sha }}
          path: artifacts/menu-v3-visual
          if-no-files-found: error
          retention-days: 14

  assets:
    name: Menu V3 asset validation
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install asset validation dependencies
        run: npm install --no-audit --no-fund

      - name: Run Menu V3 incremental asset validation
        run: npm run test:assets

      - name: Upload Menu V3 asset validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-v3-lot-5-0-assets-${{ github.sha }}
          path: artifacts/menu-v3-assets
          if-no-files-found: error
          retention-days: 14
